name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: vectors/goldens.json is valid JSON with the fields the SDKs read
        run: |
          python3 - <<'PY'
          import json
          v = json.load(open("vectors/goldens.json"))
          for k in ("chainId", "settler", "series", "quote", "signerKey", "seriesId", "digest", "signature",
                    "fillCalldataHash", "closeCalldataHash", "testnetDomainSeparator", "typeStrings", "selectors"):
              assert k in v, k
          PY
